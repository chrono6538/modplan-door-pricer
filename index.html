<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modplan Composite Door Quote Builder</title>
<style>
:root{
  --navy:#141b24; --navy2:#1c2530; --ink0:#141414;
  --accent:#e0a24e; --accent2:#c9832f; --accentglow:rgba(224,162,78,.28);
  --bg:#f5f6f8; --card:#ffffff; --line:#e5e7eb; --ink:#1d2733; --muted:#6b7280;
  --good:#1f9d6b; --warn:#d98a00; --bad:#d2453b; --radius:14px;
  --serif:Georgia,'Times New Roman',serif;
  --shadow:0 1px 3px rgba(20,20,20,.07),0 6px 20px rgba(20,20,20,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.45}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px 160px}

/* header — corporate white masthead */
header{position:sticky;top:0;z-index:30;background:#fff;color:var(--ink);
  border-bottom:3px solid var(--accent);box-shadow:0 2px 10px rgba(20,20,20,.07)}
.hbar{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:11px 16px}
.logo{display:flex;align-items:center;gap:12px}
.brandlogo{height:34px;width:auto;display:block}
.logo .dot{display:none}
.logo-sub{font-family:var(--serif);font-style:italic;color:var(--muted);font-size:13px;
  border-left:1px solid var(--line);padding-left:12px;white-space:nowrap}
.logo small{font-weight:500;color:var(--muted);font-size:12px;letter-spacing:.3px}
.vbadge{background:var(--ink0);color:var(--accent);font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:6px;margin-left:2px;letter-spacing:.5px}
.htitle{font-size:12px;color:var(--muted);margin-left:auto;text-align:right;line-height:1.35}

/* progress — dark near-black ribbon */
.steps{display:flex;gap:6px;justify-content:center;padding:9px 16px 11px;overflow-x:auto;background:var(--ink0)}
.steps::-webkit-scrollbar{height:0}
.step{flex:0 1 auto;min-width:84px;text-align:center;font-size:11px;color:#9aa1a8;
  padding:7px 10px;border-radius:9px;cursor:pointer;white-space:nowrap;transition:.15s;user-select:none}
.step .n{display:inline-flex;width:20px;height:20px;border-radius:50%;background:#2b2b2b;align-items:center;justify-content:center;
  border:1.5px solid #3a3a3a;margin-right:5px;font-weight:700;font-size:11px;color:#d9d9d9}
.step b{display:block;margin-top:2px;font-weight:600}
.step.active{background:linear-gradient(180deg,var(--accent),var(--accent2));color:#1a1a1a}
.step.done{color:#e9c896}
.step.active .n{background:#1a1a1a;color:var(--accent);border-color:#1a1a1a}

/* layout */
.grid{display:grid;grid-template-columns:1fr;gap:20px;margin-top:20px}
@media(min-width:900px){.grid{grid-template-columns:1fr 340px;align-items:start}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px}
.panel h2{margin:0 0 4px;font-size:20px;color:var(--navy)}
.panel .sub{color:var(--muted);font-size:13px;margin:0 0 18px}

/* option cards */
.opts{display:grid;gap:11px}
.opts.cols2{grid-template-columns:1fr 1fr}
.opts.cols3{grid-template-columns:1fr 1fr 1fr}
@media(max-width:560px){.opts.cols3{grid-template-columns:1fr 1fr}}
.opt{border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;cursor:pointer;background:#fff;
  transition:.13s;display:flex;flex-direction:column;gap:3px;position:relative}
.opt:hover{border-color:var(--accent);transform:translateY(-1px)}
.opt.sel{border-color:var(--accent);background:#fdf7ee;box-shadow:0 0 0 2px var(--accentglow)}
.opt .t{font-weight:650;font-size:14px}
.opt .d{font-size:12px;color:var(--muted)}
.opt .badge{position:absolute;top:9px;right:10px;font-size:10px;font-weight:700;color:var(--accent2)}
.opt.disabled{opacity:.4;pointer-events:none}

/* form controls */
label.fld{display:block;margin:14px 0 0}
label.fld .lab{font-size:12.5px;font-weight:650;color:var(--navy);margin-bottom:5px;display:block}
select,input[type=text],input[type=number],input[type=email],textarea{
  width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;font-size:14px;
  background:#fff;color:var(--ink);font-family:inherit}
select:focus,input:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accentglow)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.hint{font-size:11.5px;color:var(--muted);margin-top:4px}

/* validation */
.alert{border-radius:10px;padding:10px 13px;font-size:13px;margin-top:14px;display:flex;gap:9px;align-items:flex-start}
.alert.warn{background:#fff6e6;color:#8a5a00;border:1px solid #f0d49a}
.alert.bad{background:#fdeceb;color:#9a2b23;border:1px solid #f2bdb8}
.alert.ok{background:#eafaf3;color:#10402c;border:1px solid #b6e6cf}

/* preview */
.preview{position:sticky;top:128px}
.doorbox{background:linear-gradient(180deg,#eef2f7,#dde5ee);border-radius:14px;padding:18px;display:flex;justify-content:center}
.doorsvg{width:100%;max-width:200px;height:auto;filter:drop-shadow(0 8px 18px rgba(16,42,71,.18))}
.doorimg{width:100%;max-width:230px;height:auto;display:block;border-radius:8px;background:#fff;filter:drop-shadow(0 8px 18px rgba(16,42,71,.18))}
.spec{margin-top:14px;font-size:12.5px}
.spec div{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px dashed var(--line)}
.spec div span:first-child{color:var(--muted)}
.spec div span:last-child{font-weight:600;text-align:right}

/* price bar */
.pricebar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:1px solid var(--line);
  box-shadow:0 -4px 20px rgba(16,42,71,.1)}
.pbin{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:12px 16px}
.pblabel{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.pbprice{font-size:27px;font-weight:800;color:var(--navy);line-height:1}
.pbvat{font-size:12px;color:var(--muted)}
.pbnav{margin-left:auto;display:flex;gap:10px}
.btn{border:none;border-radius:11px;padding:13px 22px;font-size:15px;font-weight:700;cursor:pointer;
  font-family:inherit;transition:.13s}
.btn.primary{background:linear-gradient(180deg,var(--accent),var(--accent2));color:#1a1a1a}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:#eef2f7;color:var(--navy)}
.btn.ghost:hover{background:#e0e7f0}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.lg{padding:14px 26px}

/* breakdown */
.bd{font-size:13px;margin-top:6px}
.bd .ln{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed var(--line)}
.bd .ln.tot{border-top:2px solid var(--navy);border-bottom:none;font-weight:800;font-size:15px;padding-top:9px;margin-top:4px;color:var(--navy)}
.bd .ln span:first-child{color:var(--muted)}
.poa{color:var(--bad);font-weight:700}

/* quote screen */
.quote-head{display:flex;justify-content:space-between;flex-wrap:wrap;gap:16px;border-bottom:3px solid var(--navy);padding-bottom:16px;margin-bottom:18px}
.qtable{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:10px}
.qtable th{background:var(--navy);color:#fff;text-align:left;padding:9px 11px;font-size:12px}
.qtable td{padding:9px 11px;border-bottom:1px solid var(--line)}
.qtable tr:last-child td{border-bottom:none}
.qtot{text-align:right;font-size:15px}
.chip{display:inline-block;background:#eef2f7;border-radius:20px;padding:3px 11px;font-size:11.5px;color:var(--navy);font-weight:600;margin:3px 4px 0 0}
.tag{display:inline-block;background:var(--accent);color:#1a1a1a;font-size:10px;font-weight:800;padding:2px 7px;border-radius:5px;vertical-align:middle}
.foot{font-size:11px;color:var(--muted);margin-top:18px;line-height:1.5}
@media print{
  header,.steps,.pricebar,.preview,#previewCol,.noprint{display:none!important}
  .grid{grid-template-columns:1fr}.panel{box-shadow:none;border:none;padding:0}
  body{background:#fff}.wrap{padding:0}
}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:13px}
.switch input{width:auto}
.hide{display:none!important}
</style>
</head>

  <div class="hbar">
    <div class="logo">
      <img class="brandlogo" src="https://static.wixstatic.com/media/5f4cac_8cfefcac98954e9eb5b11cf9b30e6010~mv2.png/v1/crop/x_4,y_0,w_396,h_60/fill/w_520,h_79,al_c,q_95,enc_auto/modplan.png" alt="Modplan"

      <button class="btn ghost" id="backBtn">Back</button>

</div>

let DATA;
async function boot(){
  try{
    const bin = Uint8Array.from(atob(DATA_GZ_B64), c=>c.charCodeAt(0));
    const stream = new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'));
    DATA = JSON.parse(await new Response(stream).text());
    startApp();
  }catch(e){
    document.getElementById('main').innerHTML =
      '<div class="panel"><h2>Could not load pricing data</h2><p class="sub">Please use an up-to-date browser (Chrome, Edge, Safari or Firefox).</p></div>';

  }

function startApp(){
/* ===================== Modplan Composite Door Pricer ===================== */
const C = DATA.constants;
const money = n => '£' + Number(n).toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2});
const byName = (arr,nm) => arr.find(o=>o.name===nm);
const upTo100 = n => Math.ceil(n/100)*100;

/* ---- default configuration ---- */
const state = {
  step:0,
  core:'ORiGINAL',
  style:'Carnoustie',
  colour:'Green/White',
  frameStyle:'Sculptured Frame',
  outerframeColour:'White',
  width:900, height:2100,
  threshold:'68mm UPVC Frame',
  cill:'No Cill',
  handing:'Left Hand',          // viewed from outside: LH = hinges left, handle right
  fanlightDrop:0,
  sidelightW:0, sidelightH:0, sidelightQty:0,
  sideSide:'right',             // single sidelight position (viewed from outside)
  glass:'__SOLID_OR_FIRST__',
  lock:'AV4 Winkhaus',
  cylinder:'Standard Cylinder',
  handle:'White Lever/Lever',
  barExt:'Not Applicable',
  barInt:'Not Applicable',
  letterplate:'No Letterplate',
  knocker:byName(DATA.hardware.knocker,'Not Required')?'Not Required':DATA.hardware.knocker[0].name,
  hingeColour:'White SFS',
  hingeQtyName:'3 x SFS Hinges',
  dealerMode:'markup',      // 'markup' (% added to trade) or 'margin' (% of selling price)
  dealerPct:0,              // installer's own markup/margin %, 0 = trade price only
  quantity:1,
  customer:'', installer:'', ref:'', email:''
};

const STEPS = [
  {key:'core',  label:'Range'},
  {key:'config',label:'Openings'},
  {key:'style', label:'Style'},
  {key:'colour',label:'Colour'},
  {key:'size',  label:'Size'},
  {key:'glass', label:'Glazing'},
  {key:'hardware',label:'Hardware'},
  {key:'quote', label:'Quote'}
];

/* ===================== helpers ===================== */
function styleAvailable(style,core){
  const sc = DATA.slabCore[style];
  if(!sc) return true; // not in matrix -> allow (data-led)
  return (sc[core] && sc[core].avail==='Yes');
}
function stylesForCore(core){
  // union of named option list and availability; keep those with cost data when possible
  let list = DATA.styles[core] || [];
  return list;
}
function classFor(style,core){
  const sc=DATA.slabCore[style];
  return sc && sc[core] ? sc[core].class : '';
}
function gridLookup(g,w,h){
  const ws=[...g.widths].sort((a,b)=>a-b), hs=[...g.heights].sort((a,b)=>a-b);
  const W=ws.find(x=>x>=w) ?? ws[ws.length-1];
  const H=hs.find(x=>x>=h) ?? hs[hs.length-1];
  const row=g.cells[H]; if(!row) return null;
  return row[W] ?? null;
}
function glassForStyle(style){ return DATA.glass[style] || []; }
function isSolid(style){ return /solid/i.test(style); }
function slabCostKey(style,colour){ return style+'||'+colour; }
function coreColours(core){ return (DATA.coreColours && DATA.coreColours[core]) || []; }
function outerframeColoursFor(frameStyle){ const bev=/bevel/i.test(frameStyle||''); return (DATA.outerframeColours||[]).filter(c=>!c.bevelledOnly||bev); }
function outerframeColourEntry(name){ return (DATA.outerframeColours||[]).find(c=>c.name===name); }
function ensureOuterframeValid(){ const l=outerframeColoursFor(state.frameStyle); if(!l.find(c=>c.name===state.outerframeColour)) state.outerframeColour='White'; }
function colourEntry(core,label){ return coreColours(core).find(c=>c.label===label); }
function colourKey(core,label){ const e=colourEntry(core,label); return e ? e.key : label; }
function getSlabCost(core,style,label){
  const m=DATA.slabCosts[core]||{};
  const key=colourKey(core,label);
  if(key===null||key===undefined) return undefined;      // POA (e.g. Gripcore RAL/Stain)
  if(m[slabCostKey(style,key)]!==undefined) return m[slabCostKey(style,key)];
  return undefined;
}
function minMaxFor(core,style){
  const mm = DATA.minMax[core] || DATA.minMax['ORiGINAL'] || {};
  return mm[style] || null;
}

/* ===================== PRICING ENGINE ===================== */
function price(cfg){
  const mk=C.markup, sd=C.slabDiscount, fd=C.frameDiscount, sld=C.sidelightDiscount;
  const out={lines:[], warnings:[], notes:[], poa:false, available:true};

  // --- slab ---
  let slabCost = getSlabCost(cfg.core,cfg.style,cfg.colour);
  let slabColourFallback=false;
  if(slabCost===undefined){
    // try white/white as a base if colour variant missing
    const w = getSlabCost(cfg.core,cfg.style,'White/White') ?? getSlabCost(cfg.core,cfg.style,'White');
    if(w!==undefined){ slabCost=w; slabColourFallback=true; }
  }
  if(slabCost===undefined){
    out.available=false; out.poa=true;
    out.notes.push(cfg.core==='GRiPCORE'
      ? 'Gripcore slab costs are not yet loaded into this tool — price on application from Modplan.'
      : 'No price found for this style + colour combination — price on application.');
    out.total=0; out.incVat=0; return out;
  }
  if(slabColourFallback) out.notes.push('Exact colour price not in list for this slab — based on White; confirm colour surcharge with Modplan.');

  const slabSell = slabCost*(1+mk)*(1-sd);
  out.lines.push(['Door slab ('+cfg.style+', '+cfg.colour+')', slabSell]);

  // --- frame sizing ---
  const frameW = cfg.width;            // add-ons not in V1 UI -> 0
  const frameH = cfg.height;
  const grid = gridLookup(DATA.gridPrices, frameW, frameH);
  let frameSell = grid!==null ? grid*(1-fd) : 0;
  // outerframe colour surcharge: grid×uplift×(1-frameDisc) [discountable] + grid×MTO + grid×excess [non-discountable]
  const ofName = cfg.outerframeColour || 'White';
  const ofc = outerframeColourEntry(ofName);
  let colourSurcharge = 0;
  if(ofc && grid!==null){
    colourSurcharge = grid*(ofc.uplift||0)*(1-fd) + grid*(ofc.mtoFactor||0) + grid*(ofc.excessFactor||0);
    if(ofc.mto) out.notes.push('Outerframe colour '+ofName+' is made-to-order (50 working days).');
  }
  const outerframe = frameSell + (isFinite(colourSurcharge)?colourSurcharge:0);
  out.lines.push(['Outerframe ('+frameW+'×'+frameH+'mm, '+ofName+')', outerframe]);

  // --- threshold uplift ---
  const thr = byName(DATA.hardware.threshold,cfg.threshold) || {sell:0,deduction:52};
  if(thr.sell) out.lines.push(['Threshold: '+cfg.threshold, thr.sell]);

  // --- cill --- £/m (by cill type + outerframe colour) × (width+150)/1000 × (1 - frame discount)
  const cillOpt = byName(DATA.hardware.cill,cfg.cill) || {heightDeduct:0};
  let cillSell=0;
  const cpm = (DATA.cills||{})[cfg.cill+'||'+ofName];
  if(cpm){ cillSell = cpm*((cfg.width+150)/1000)*(1-fd); }
  if(cillSell) out.lines.push(['Cill: '+cfg.cill+' ('+ofName+')', cillSell]);

  // --- hardware sells ---
  const add=(arr,nm,lbl)=>{const o=byName(arr,nm); if(o&&o.sell){out.lines.push([lbl+': '+nm,o.sell]); return o.sell;} return 0;};
  add(DATA.hardware.lock,cfg.lock,'Lock');
  add(DATA.hardware.cylinder,cfg.cylinder,'Cylinder');
  add(DATA.hardware.handle,cfg.handle,'Handle');
  if(isLongBar(cfg.handle) && DATA.hardware.longbar){
    add(DATA.hardware.longbar,cfg.barExt,'Long bar (external)');
    add(DATA.hardware.longbar,cfg.barInt,'Long bar (internal)');
  }
  add(DATA.hardware.letterplate,cfg.letterplate,'Letterplate');
  add(DATA.hardware.knocker,cfg.knocker,'Knocker/Spyhole');

  // --- hinges ---
  let hingeQty = (cfg.core==='GRiPCORE') ? 4 : (byName(DATA.hardware.hingeQty,cfg.hingeQtyName)?.qty || 3);
  const hc = byName(DATA.hardware.hingeColour,cfg.hingeColour) || {listPerHinge:0};
  const hingesSell = hc.listPerHinge*hingeQty*(1-fd);
  out.lines.push(['Hinges ('+hingeQty+' × '+cfg.hingeColour+')', hingesSell]);

  // --- fixed ---
  out.lines.push(['Outerframe reinforcement', C.reinforcement]);
  out.lines.push(['Corner protectors', C.cornerProtectors]);

  // --- fanlight / transom --- priced by outerframe colour, discounted by frame discount
  if(cfg.fanlightDrop>0){
    const tprice = DATA.transomByColour[ofName];
    if(tprice===null || tprice===undefined){
      out.warnings.push('A transom (fanlight) is not available in outerframe colour '+ofName+' — choose another frame colour or remove the fanlight.');
    } else {
      out.lines.push(['Transom (fanlight, '+ofName+')', tprice*(1-fd)]);
    }
  }

  // --- sidelight --- full profile: base + colour surcharge (disc) + excess (non-disc) + profile uplift/m + reinforcement + coupler
  if(cfg.sidelightQty>0 && cfg.sidelightW>0){
    const sg = gridLookup(DATA.sideLightGrid, upTo100(cfg.sidelightW), upTo100(cfg.height));
    if(sg!==null){
      const sc = (DATA.tsColour||{})[ofName] || {surcharge:0,excess:0,reinfSculpt:12.72,reinfBevel:12.72,upliftPerM:0};
      const bev=/bevel/i.test(cfg.frameStyle||'');
      const reinf = bev ? sc.reinfBevel : sc.reinfSculpt;
      const perim = ((cfg.height-(cillOpt.heightDeduct||0))*2 + (cfg.sidelightW-20)*2)/1000;
      const couplerList = DATA.coupler[ofName]||0;
      const perSide = sg*(1-sld)                          // base grid
                    + sg*(sc.surcharge||0)*(1-sld)        // colour surcharge (discountable)
                    + sg*(sc.excess||0)                   // excess profile (non-discountable)
                    + (sc.upliftPerM||0)*perim*(1-sld)    // profile uplift per metre
                    + reinf                               // reinforcement (non-discountable)
                    + 0.26                                // corner
                    + couplerList*(cfg.height/1000)*(1-sld); // 20mm coupler
      out.lines.push([`Sidelight ×${cfg.sidelightQty} (${cfg.sidelightW}mm, ${ofName})`, perSide*cfg.sidelightQty]);
      out.notes.push('Sidelight pricing is reconstructed from the master sheet — worth validating a couple of configs.');
    } else {
      out.warnings.push('Sidelight width is outside the priced grid.');
    }
  }

  // --- glass ---
  const solid = isSolid(cfg.style);
  if(!solid){
    const gl = byName(glassForStyle(cfg.style), cfg.glass);
    if(gl){
      const glassSell = gl.doorSet*(1+mk)*(1-sd);
      out.lines.push(['Glazing: '+cfg.glass, glassSell]);
    } else {
      out.warnings.push('Select a glass design to complete the price.');
    }
  }

  // --- totals ---  out.total = Modplan trade price (ex VAT); out.customer = installer's selling price
  const total = out.lines.reduce((s,l)=>s+l[1],0);
  out.total = total;
  out.incVat = total*(1+C.vatRate);
  const mode = cfg.dealerMode||'markup', pct = +cfg.dealerPct||0;
  let cust = total;
  if(pct>0){ cust = (mode==='margin') ? total/(1-Math.min(pct,95)/100) : total*(1+pct/100); }
  out.dealerMode=mode; out.dealerPct=pct;
  out.customer=cust; out.customerInc=cust*(1+C.vatRate); out.dealerProfit=cust-total;

  // --- size validation ---
  const mm = minMaxFor(cfg.core,cfg.style);
  if(mm){
    const slabW = cfg.width - C.frameToSlabWidth;
    const ali = /alumin/i.test(cfg.threshold);
    const thrDeduct = thr.deduction||0;
    const fanExtra = cfg.fanlightDrop>0 ? (ali?20:19) : 0;
    const slabH = cfg.height - (cillOpt.heightDeduct||0) - cfg.fanlightDrop - thrDeduct - fanExtra;
    if(mm.minW&&slabW<mm.minW) out.warnings.push(`Width too small — min frame width for ${cfg.style} is ${mm.minW+C.frameToSlabWidth}mm.`);
    if(mm.maxW&&slabW>mm.maxW) out.warnings.push(`Width too large — max frame width for ${cfg.style} is ${mm.maxW+C.frameToSlabWidth}mm.`);
    if(mm.minH&&slabH<mm.minH) out.warnings.push(`Height too small for the chosen options (slab would be ${slabH}mm, min ${mm.minH}mm).`);
    if(mm.maxH&&slabH>mm.maxH) out.warnings.push(`Height too large for the chosen options (slab would be ${slabH}mm, max ${mm.maxH}mm).`);
    out.slabW=slabW; out.slabH=slabH;
  }
  if(grid===null) out.warnings.push('Frame size is outside the standard price grid.');
  return out;
}

function fieldSelect(label,options,value,onchange,hint){
  const wrap=document.createElement('label'); wrap.className='fld';
  wrap.innerHTML=`<span class="lab">${label}</span>`;
  const sel=document.createElement('select');
  options.forEach(o=>{
    const opt=document.createElement('option');

    opt.value=v; opt.textContent=t; if(v===value) opt.selected=true; sel.appendChild(opt);

  wrap.appendChild(sel);

function palEntry(name){ return (DATA.dcPalette||[]).find(e=>e[0]===name)||null; }
function palSwatchUrl(e){
  const file=e[1] || e[0].toLowerCase().replace(/ /g,'_');
  return '/dc/578%2fslab_colour%2foption_'+encodeURIComponent(file).replace(/\(/g,'(').replace(/\)/g,')')+'.jpg';
}
// Runtime swatch sampling: tint hex comes from DoorCo's own swatch image (always exact, no manual table)
const PAL_HEX={};
function palHex(name){
  if(name in PAL_HEX) return PAL_HEX[name];
  const e=palEntry(name); if(!e) return undefined;
  PAL_HEX[name]=null;   // sampling in progress
  const img=new Image();
  img.onload=()=>{ try{
    const cv=document.createElement('canvas'); cv.width=img.naturalWidth; cv.height=img.naturalHeight;
    const ctx=cv.getContext('2d'); ctx.drawImage(img,0,0);
    const w=cv.width,h=cv.height;
    const d=ctx.getImageData(Math.floor(w*0.25),Math.floor(h*0.25),Math.max(1,Math.floor(w*0.5)),Math.max(1,Math.floor(h*0.5))).data;
    let r=0,g=0,b=0,n=0; for(let i=0;i<d.length;i+=16){ r+=d[i];g+=d[i+1];b+=d[i+2];n++; }
    PAL_HEX[name]='#'+[r,g,b].map(v=>Math.round(v/n).toString(16).padStart(2,'0')).join('');
    if(state.colour===name) recalc();   // re-render with the true colour once sampled
  }catch(err){ PAL_HEX[name]='#c9ccd0'; } };
  img.onerror=()=>{ PAL_HEX[name]='#c9ccd0'; };
  img.src=palSwatchUrl(e);
  return null;
}

/* ---- Step 6: Hardware ---- */
function isLongBar(h){ return /Long Bar/i.test(h==null?state.handle:h); }

function selWithPrice(arr){ return arr.map(o=>({value:o.name,label:o.name+(o.sell?` (+${money(o.sell)})`:'')})); }

/* ---- Quote price helpers (targeted live-update, no input rebuild) ---- */
function qPriceTableHTML(r){
  const unit=r.total, qty=state.quantity||1, cust=r.customer||r.total, custInc=r.customerInc||r.incVat, showCust=(+state.dealerPct>0);
  if(r.poa) return '<tr><th>Price</th><th class="qtot">Amount</th></tr><tr><td>Price on application</td><td class="qtot poa">POA</td></tr>';
  let h='<tr><th>Price</th><th class="qtot">Amount</th></tr>'+
    `<tr><td>Modplan trade — unit (ex VAT)</td><td class="qtot">${money(unit)}</td></tr>`+
    (qty>1?`<tr><td>Trade × ${qty}</td><td class="qtot">${money(unit*qty)}</td></tr>`:'');
  if(showCust){
    h+=`<tr><td>Your ${state.dealerMode==='margin'?'margin':'mark-up'} @ ${(+state.dealerPct)}%</td><td class="qtot">+${money((cust-unit)*qty)}</td></tr>`+
       `<tr><td><b>Your price (ex VAT)</b></td><td class="qtot"><b>${money(cust*qty)}</b></td></tr>`+
       `<tr><td>VAT @ 20%</td><td class="qtot">${money(cust*qty*C.vatRate)}</td></tr>`+
       `<tr><td><b>Customer total inc VAT</b></td><td class="qtot"><b>${money(custInc*qty)}</b></td></tr>`;
  }else{
    h+=`<tr><td>VAT @ 20%</td><td class="qtot">${money(unit*qty*C.vatRate)}</td></tr>`+
       `<tr><td><b>Total inc VAT</b></td><td class="qtot"><b>${money(r.incVat*qty)}</b></td></tr>`;
  }
  return h;
}
function updateQuoteReadout(){
  recalc(); const r=LAST; if(!r) return;
  const unit=r.total, qty=state.quantity||1, cust=r.customer||r.total, custInc=r.customerInc||r.incVat, showCust=(+state.dealerPct>0);
  const headEx=(showCust?cust:unit)*qty, headInc=(showCust?custInc:r.incVat)*qty;
  const set=(id,v)=>{const e=document.getElementById(id); if(e) e.innerHTML=v;};
  set('qhLabel', showCust?'Your customer price (ex VAT)':'Trade quote (ex VAT)');
  set('qhPrice', r.poa?'POA':money(headEx));
  set('qhInc', r.poa?'':'inc VAT '+money(headInc));
  set('qcReadout', (showCust&&!r.poa)?money(cust):'—');
  set('qcHint', (showCust&&!r.poa)?('inc VAT '+money(custInc)+' · +'+money(cust-unit)+'/door'):'trade price only — add a % to set your price');
  set('qPriceTable', qPriceTableHTML(r));
}

  p.innerHTML=`
    <div class="quote-head">
      <div>

      </div>
      <div style="text-align:right">
        <div class="hint" id="qhLabel">${showCust?'Your customer price (ex VAT)':'Trade quote (ex VAT)'}</div>
        <div id="qhPrice" style="font-size:26px;font-weight:800;color:var(--navy)">${r.poa?'POA':money(headEx)}</div>

      <label class="fld"><span class="lab">Quote reference</span><input id="qRef" type="text" value="${state.ref||''}" placeholder="Optional"></label>
      <label class="fld"><span class="lab">Quantity</span><input id="qQty" type="number" min="1" value="${qty}"></label>
    </div>
    <div class="row noprint" style="align-items:flex-end">
      <label class="fld"><span class="lab">Add your mark-up / margin</span>
        <div style="display:flex;gap:6px">
          <select id="qMode"><option value="markup">Mark-up %</option><option value="margin">Margin %</option></select>
          <input id="qPct" type="number" min="0" max="90" step="0.5" value="${+state.dealerPct||0}" style="max-width:90px">
        </div>

      <div class="fld"><span class="lab">Your customer price (ex VAT)</span>

      if(res&&res.ok){ status.textContent='Emailed to '+state.email+' ✓'; status.style.color='var(--good)'; return; }

  ['qCustomer','qRef','qEmail','qQty'].forEach(id=>{
    const e=document.getElementById(id); if(e) e.addEventListener('input',()=>{ if(id==='qQty'){state.quantity=Math.max(1,+e.value||1);} syncQuoteFields(); });
  });
  const qm=document.getElementById('qMode'); if(qm){ qm.value=state.dealerMode||'markup'; qm.onchange=()=>{ state.dealerMode=qm.value; updateQuoteReadout(); }; }
  const qp=document.getElementById('qPct'); if(qp){ const apply=()=>{ state.dealerPct=Math.max(0,Math.min(90,+qp.value||0)); updateQuoteReadout(); }; qp.oninput=apply; qp.onchange=apply; }
  const qq=document.getElementById('qQty'); if(qq){ qq.oninput=()=>{ state.quantity=Math.max(1,+qq.value||1); updateQuoteReadout(); }; }

function syncQuoteFields(){
  state.customer=val('qCustomer'); state.ref=val('qRef'); state.email=val('qEmail');
  const q=document.getElementById('qQty'); if(q) state.quantity=Math.max(1,+q.value||1);
  const qp=document.getElementById('qPct'); if(qp) state.dealerPct=Math.max(0,Math.min(90,+qp.value||0));
  const qm=document.getElementById('qMode'); if(qm) state.dealerMode=qm.value;
}
function quoteRecord(){
  const r=LAST, s=state;
  return { quote_ref:s.ref||null, customer_name:s.customer||null, customer_email:s.email||null,
    spec:{core:s.core,style:s.style,colour:s.colour,frameStyle:s.frameStyle,outerframeColour:s.outerframeColour,
      width:s.width,height:s.height,threshold:s.threshold,cill:s.cill,fanlightDrop:s.fanlightDrop,
      sidelightW:s.sidelightW,sidelightQty:s.sidelightQty,glass:s.glass,lock:s.lock,cylinder:s.cylinder,

    trade_ex:r.poa?null:+r.total.toFixed(2), trade_inc:r.poa?null:+r.incVat.toFixed(2),
    dealer_mode:s.dealerMode, dealer_pct:+s.dealerPct||0,
    customer_ex:r.poa?null:+(r.customer||r.total).toFixed(2), customer_inc:r.poa?null:+(r.customerInc||r.incVat).toFixed(2),

window.__loadQuote=function(q){
  const sp=q.spec||{}; Object.keys(sp).forEach(k=>{ if(sp[k]!==undefined) state[k]=sp[k]; });
  state.customer=q.customer_name||''; state.email=q.customer_email||''; state.ref=q.quote_ref||'';
  state.dealerMode=q.dealer_mode||'markup'; state.dealerPct=q.dealer_pct||0; state.quantity=q.quantity||1;
  ensureColourValid(); ensureGlassValid(); ensureOuterframeValid();

};

  if(state.ref) L.push('Reference: '+state.ref);
  if(state.customer) L.push('Customer: '+state.customer);
  L.push('');
  L.push('SPECIFICATION');
  L.push('  Range: '+state.core);
  L.push('  Style: '+state.style);
  L.push('  Colour: '+state.colour);
  L.push('  Outerframe: '+state.frameStyle+' - '+state.outerframeColour);

  L.push('  Letterplate: '+state.letterplate);
  L.push('  Knocker/Spyhole: '+state.knocker);
  L.push('  Hinges: '+(state.core==='GRiPCORE'?4:byName(DATA.hardware.hingeQty,state.hingeQtyName)?.qty||3)+' x '+state.hingeColour);

  const href='mailto:'+encodeURIComponent(state.email)+'?subject='+encodeURIComponent(subj)+'&body='+encodeURIComponent(L.join('\n'));
  try{ window.__lastQuoteEmail=href; }catch(e){}
  window.location.href=href;

// DoorCo's OWN slab tint values, captured from their configurator's colour-burn filters
// (6 Aug 2026). White = untinted slab, exactly as DoorCo renders it.
const COLOUR_HEX={
 'White':null,'Black':'#262626','Blue':'#0b274a','Green':'#003821','Red':'#8f042d',
 'Cream':'#e8e2d8','Chartwell Green':'#84a190','Agate Grey':'#b6c1bc','Anthracite Grey':'#38424a',
 'Anth Grey':'#38424a','Silver Grey':'#899698','Slate Grey':'#4b535b','Slate':'#4b535b',

 'Black Brown':'#161514','Oak':'#b58a4e','Golden Oak':'#995d28','Golden Oak Stain':'#995d28',
 'Rosewood':'#634139','Rosewood Stain':'#634139','Irish Oak':'#c0915c','Irish Oak Stain':'#c0915c'
};
function colourHex(c){
  const base=String(c).split('/')[0].trim();
  if(base in COLOUR_HEX) return COLOUR_HEX[base];   // may be null = White (untinted/whitened)
  // full DoorCo palette: tint sampled live from DoorCo's own swatch image (exact colour)
  if(typeof palEntry==='function' && palEntry(base)){
    if(/^White$/i.test(base)) return null;
    const h=palHex(base);
    if(h) return h;
    return '#d7d9db';   // neutral while the swatch loads; recalc() fires when sampled
  }
  return /RAL/i.test(c)?'#c9ccd0':(/Stain/i.test(c)?'#7a4a23':'#cfae73');
}
function hexToRgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(x=>x+x).join('');
  return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
// Recolour the door photo by luminance gradient-map: shadows->black, body->target, glazing/whites->white.
// Keeps near-white (glass/frame) and near-black (outlines) largely intact so the door still reads correctly.
// DoorCo-style render: desaturate the photo to a neutral grey slab, MULTIPLY-tint it to the chosen
// colour (clean, no blow-out/blotches), and clip the glass strictly into the verified per-style
// aperture rectangles (apRects) so it never bleeds onto the door body.
function recolourDoor(img, hex, canvas, colourLabel, glassImg, apRects, doorBox){
  const [tr,tg,tb]=hexToRgb(hex);
  const isWhite=/^White\b/i.test(String(colourLabel||'').split('/')[0].trim());
  const w=img.naturalWidth||img.width, h=img.naturalHeight||img.height;
  if(!w||!h) return;
  canvas.width=w; canvas.height=h;
  const ctx=canvas.getContext('2d');
  ctx.drawImage(img,0,0,w,h);
  let id; try{ id=ctx.getImageData(0,0,w,h); }catch(e){ return; }
  const d=id.data, N=w*h;
  // bright & desaturated pixels = a glass opening (cream) or the white surround
  const cls=new Uint8Array(N);
  for(let p=0;p<N;p++){ const i=p*4; const r=d[i],g=d[i+1],b=d[i+2]; const mx=r>g?(r>b?r:b):(g>b?g:b), mn=r<g?(r<b?r:b):(g<b?g:b); cls[p]=(mx>182 && (mx-mn)<60)?1:0; }
  // The door sits in a known bounding box (precomputed per style). Everything OUTSIDE it is the white
  // surround; everything inside is door. This replaces flood-fill, so bright woodgrain that touches the
  // door edge can never leak the white surround into the door body (no more white blotches).
  const bx=doorBox||[0,0,1,1];
  const bx0=(bx[0]*w)|0, by0=(bx[1]*h)|0, bx1=Math.ceil(bx[2]*w), by1=Math.ceil(bx[3]*h);
  const bg=new Uint8Array(N);
  for(let y=0;y<h;y++){ const inY=(y>=by0&&y<=by1), row=y*w; for(let x=0;x<w;x++){ if(!inY||x<bx0||x>bx1) bg[row+x]=1; } }
  // verified per-style aperture rects -> pixel coords. A pixel is GLASS only if it is a bright opening INSIDE a rect.
  const rects=(apRects||[]).map(r=>[Math.max(0,Math.round(r[0]*w)),Math.max(0,Math.round(r[1]*h)),Math.min(w-1,Math.round(r[2]*w)),Math.min(h-1,Math.round(r[3]*h))]);
  const rectOf=new Int16Array(N); rectOf.fill(-1);
  for(let ri=0;ri<rects.length;ri++){ const[x0,y0,x1,y1]=rects[ri]; for(let y=y0;y<=y1;y++){ const row=y*w; for(let x=x0;x<=x1;x++) rectOf[row+x]=ri; } }
  // cover-fit the glass design once into each aperture rect
  const glassData=rects.map(()=>null);
  if(glassImg && (glassImg.naturalWidth||glassImg.width)){
    const gW=glassImg.naturalWidth||glassImg.width, gH=glassImg.naturalHeight||glassImg.height;
    for(let ri=0;ri<rects.length;ri++){ const[x0,y0,x1,y1]=rects[ri]; const bw=x1-x0+1,bh=y1-y0+1; if(bw<4||bh<4) continue;
      const oc=document.createElement('canvas'); oc.width=bw; oc.height=bh; const octx=oc.getContext('2d');
      const s=Math.max(bw/gW,bh/gH), dw2=Math.round(gW*s), dh2=Math.round(gH*s);
      octx.imageSmoothingQuality='high';
      octx.drawImage(glassImg,0,0,gW,gH,Math.round((bw-dw2)/2),Math.round((bh-dh2)/2),dw2,dh2);
      let od; try{ od=octx.getImageData(0,0,bw,bh).data; }catch(e){ od=null; }
      glassData[ri]=od?{data:od,bw,bx:x0,by:y0}:null;
    }
  }
  // median door-body luminance = the "full colour" point for the multiply tint
  const hist=new Array(256).fill(0); let cnt=0;
  for(let p=0;p<N;p++){ if(!bg[p] && !(rectOf[p]>=0 && cls[p]===1)){ const i=p*4; const L=(d[i]*0.299+d[i+1]*0.587+d[i+2]*0.114)|0; if(L>18&&L<236){hist[L]++;cnt++;} } }
  let acc=0, medL=140; const tgt=cnt*0.62; for(let k=0;k<256;k++){ acc+=hist[k]; if(acc>=tgt){ medL=k; break; } } medL=Math.max(75,medL);
  // paint
  for(let p=0;p<N;p++){ const i=p*4;
    if(bg[p]) continue;                                     // white surround -> keep white
    const ri=rectOf[p];
    if(ri>=0 && cls[p]===1){                                 // glass opening inside a mapped aperture
      const gd=glassData[ri];
      if(gd){ const x=p%w,y=(p/w)|0; const gi=((y-gd.by)*gd.bw+(x-gd.bx))*4; d[i]=gd.data[gi]; d[i+1]=gd.data[gi+1]; d[i+2]=gd.data[gi+2]; }
      else { d[i]=226; d[i+1]=234; d[i+2]=239; }             // no decorative glass -> clean flat clear-glass (kills the photo's shadow in the aperture)
      continue;
    }
    // BODY (incl. moulding bars and highlights) -> smooth multiply tint of the grey shading
    const L=d[i]*0.299+d[i+1]*0.587+d[i+2]*0.114;
    if(isWhite){
      // White must read WHITE, not silver: lift the body toward near-white, keep grooves as soft shading
      let sw=L/medL; if(sw>1) sw=1; if(sw<0.15) sw=0.15;
      const t=Math.min(255,(250*(0.55+0.45*sw))|0);
      d[i]=t; d[i+1]=t; d[i+2]=t;
      continue;
    }
    let sh=L/medL; if(sh>1.12) sh=1.12; if(sh<0.12) sh=0.12;
    d[i]=Math.min(255,(tr*sh)|0); d[i+1]=Math.min(255,(tg*sh)|0); d[i+2]=Math.min(255,(tb*sh)|0);
  }
  ctx.putImageData(id,0,0);
}

function glassFillSVG(kind, x, y, w, h, sfx){

       +`<polygon points="${cx},${yc-hh} ${cx+hw},${yc} ${cx},${yc+hh} ${cx-hw},${yc}" fill="none" stroke="${LC}" stroke-width="${lead*0.5}"/>`;

    g+=`<polygon points="${cx},${cy-d*0.5} ${cx+d*0.5},${cy} ${cx},${cy+d*0.5} ${cx-d*0.5},${cy}" fill="#a7c6a0" fill-opacity="0.55" stroke="${LC}" stroke-width="${lead*0.7}"/>`;

// Returns an inline <svg> string (clean, DoorCo-accurate) or null if this style has no recipe.
function doorcoSVG(style, hex, glassUrl, opts){

    const tr=trStr?` transform="${trStr}"`:'';

  if(i>=CDNS.length){ console.error('Modplan: Supabase failed to load'); return; }
  const s=document.createElement('script'); s.src=CDNS[i];
  s.onload=()=>{ (window.supabase&&window.supabase.createClient)?init():loadSB(i+1); };
  s.onerror=()=>loadSB(i+1); document.head.appendChild(s); }
let sb;
function init(){
sb=window.supabase.createClient(SB_URL, SB_KEY);
window.__sb=sb; window.__dealer=null;
const needsPw=/type=(recovery|invite)/.test(location.hash+location.search);
const money=n=>'£'+Number(n||0).toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2});

/* ---------- auth screens ---------- */
let mode='login'; // login | forgot | reset
function renderAuth(){
  const c=document.getElementById('authCard');
  if(mode==='reset'){
    c.innerHTML=`<h1><span class="dot"></span>Set a new password</h1><p class="sub">Choose a new password for your account.</p>
      <label>New password</label><input id="npw" type="password" autocomplete="new-password">
      <div class="autherr" id="aerr"></div><div class="authok" id="aok"></div>
      <button class="authbtn" id="abtn">Save password</button>`;
    document.getElementById('abtn').onclick=updatePassword;
  } else if(mode==='forgot'){
    c.innerHTML=`<h1><span class="dot"></span>Reset password</h1><p class="sub">Enter your email and we'll send you a reset link.</p>
      <label>Email</label><input id="email" type="email" autocomplete="username">
      <div class="autherr" id="aerr"></div><div class="authok" id="aok"></div>
      <button class="authbtn" id="abtn">Send reset link</button>
      <button class="authlink" id="alink">Back to sign in</button>`;
    document.getElementById('abtn').onclick=forgot;
    document.getElementById('alink').onclick=()=>{mode='login';renderAuth();};
  } else {
    c.innerHTML=`<h1><span class="dot"></span>MODPLAN <span style="font-size:13px;color:#6b7a8d;font-weight:500">Door Pricer</span></h1>
      <p class="sub">Dealer sign in</p>
      <label>Email</label><input id="email" type="email" autocomplete="username">
      <label>Password</label><input id="pw" type="password" autocomplete="current-password">
      <div class="autherr" id="aerr"></div><div class="authok" id="aok"></div>
      <button class="authbtn" id="abtn">Sign in</button>
      <button class="authlink" id="alink">Forgot password?</button>`;
    document.getElementById('abtn').onclick=login;
    document.getElementById('alink').onclick=()=>{mode='forgot';renderAuth();};
    const pw=document.getElementById('pw'); if(pw) pw.onkeydown=e=>{ if(e.key==='Enter') login(); };
  }
}
const err=m=>{const e=document.getElementById('aerr'); if(e){e.textContent=m;e.style.display='block';} const o=document.getElementById('aok'); if(o)o.style.display='none';};
const ok=m=>{const e=document.getElementById('aok'); if(e){e.textContent=m;e.style.display='block';} const x=document.getElementById('aerr'); if(x)x.style.display='none';};
async function login(){
  const email=(document.getElementById('email')||{}).value, pw=(document.getElementById('pw')||{}).value;
  const b=document.getElementById('abtn'); b.disabled=true; b.textContent='Signing in…';
  const {error}=await sb.auth.signInWithPassword({email:email.trim(),password:pw});
  b.disabled=false; b.textContent='Sign in';
  if(error) err(error.message||'Sign in failed');
}
async function forgot(){
  const email=(document.getElementById('email')||{}).value;
  const b=document.getElementById('abtn'); b.disabled=true;
  const {error}=await sb.auth.resetPasswordForEmail(email.trim(),{redirectTo:location.origin+location.pathname});
  b.disabled=false;
  if(error) err(error.message); else ok('If that email has an account, a reset link is on its way.');
}
async function updatePassword(){
  const npw=(document.getElementById('npw')||{}).value;
  if((npw||'').length<8){ err('Use at least 8 characters.'); return; }
  const b=document.getElementById('abtn'); b.disabled=true;
  const {error}=await sb.auth.updateUser({password:npw});
  b.disabled=false;
  if(error) err(error.message); else { ok('Password set. Loading your account…'); setTimeout(()=>{ location.href=location.origin+location.pathname; },900); }
}

/* ---------- profile ---------- */
async function loadProfile(){
  const {data:{user}}=await sb.auth.getUser(); if(!user) return null;
  let {data}=await sb.from('profiles').select('*').eq('id',user.id).single();
  if(!data){ data={id:user.id,email:user.email}; }
  data.email=data.email||user.email;
  window.__dealer=data; return data;
}
function logoUrl(path){ if(!path) return null; return sb.storage.from('logos').getPublicUrl(path).data.publicUrl; }
function openProfile(){
  const d=window.__dealer||{};
  const lu=logoUrl(d.logo_path);
  profileModal.querySelector('*')&&(profileModal.innerHTML='');
  profileModal.innerHTML=`<div class="box"><h2>Your business details</h2>
    <p style="color:#6b7a8d;font-size:13px;margin:-6px 0 6px">These appear on every quote you print or email.</p>
    <label>Business name</label><input id="p_biz" value="${(d.business_name||'').replace(/"/g,'&quot;')}">
    <label>Contact name</label><input id="p_con" value="${(d.contact_name||'').replace(/"/g,'&quot;')}">
    <label>Address</label><textarea id="p_addr" rows="2">${d.address||''}</textarea>
    <label>Phone</label><input id="p_phone" value="${(d.phone||'').replace(/"/g,'&quot;')}">
    <label>Contact email (shown on quotes)</label><input id="p_email" value="${(d.email||'').replace(/"/g,'&quot;')}">
    <label>Logo</label>
    <div style="display:flex;align-items:center;gap:12px;margin-top:4px">
      <img id="p_logoimg" src="${lu||''}" style="height:46px;max-width:150px;object-fit:contain;${lu?'':'display:none'};border:1px solid #e3e8ef;border-radius:6px;background:#fff">
      <input id="p_logo" type="file" accept="image/*" style="border:none;padding:0">
    </div>
    <div class="autherr" id="perr"></div><div class="authok" id="pok"></div>
    <div class="mp-row"><button class="authbtn" id="p_save">Save</button><button class="authbtn mp-ghost" id="p_close">Close</button></div>
  </div>`;
  profileModal.style.display='flex';
  profileModal.querySelector('#p_close').onclick=()=>profileModal.style.display='none';
  profileModal.querySelector('#p_save').onclick=saveProfile;
}
async function saveProfile(){
  const g=id=>(profileModal.querySelector('#'+id)||{}).value;
  const perr=profileModal.querySelector('#perr'), pok=profileModal.querySelector('#pok');
  const btn=profileModal.querySelector('#p_save'); btn.disabled=true; btn.textContent='Saving…';
  try{
    const d=window.__dealer;
    const file=(profileModal.querySelector('#p_logo')||{}).files?.[0];
    let logo_path=d.logo_path;
    if(file){
      const ext=(file.name.split('.').pop()||'png').toLowerCase();
      logo_path=`${d.id}/logo.${ext}`;
      const {error:ue}=await sb.storage.from('logos').upload(logo_path,file,{upsert:true,contentType:file.type});
      if(ue) throw ue;
    }
    const upd={business_name:g('p_biz'),contact_name:g('p_con'),address:g('p_addr'),phone:g('p_phone'),email:g('p_email'),logo_path,updated_at:new Date().toISOString()};
    const {error}=await sb.from('profiles').update(upd).eq('id',d.id);
    if(error) throw error;
    Object.assign(window.__dealer,upd);
    updateAcctBar();
    pok.textContent='Saved.'; pok.style.display='block'; perr.style.display='none';
    setTimeout(()=>profileModal.style.display='none',700);
  }catch(e){ perr.textContent=e.message||'Save failed'; perr.style.display='block'; }
  btn.disabled=false; btn.textContent='Save';
}

/* ---------- quotes ---------- */
window.__saveQuote=async function(rec){
  const {data:{user}}=await sb.auth.getUser(); if(!user) return {error:'not signed in'};
  const row=Object.assign({dealer_id:user.id},rec);
  const {data,error}=await sb.from('quotes').insert(row).select().single();
  return {data,error};
};
/* Send the branded quote as a real HTML email via the Supabase Edge Function (Modplan SMTP).
   Invisible BCC to Modplan is added server-side. Returns {ok} or {error}. */
window.__emailQuote=async function({to,subject,html,replyTo,text}){
  try{
    const {data:{session}}=await sb.auth.getSession();
    if(!session) return {error:'not signed in'};
    const res=await fetch(SB_URL+'/functions/v1/send-quote',{
      method:'POST',
      headers:{'Authorization':'Bearer '+session.access_token,'apikey':SB_KEY,'Content-Type':'application/json'},
      body:JSON.stringify({to,subject,html,replyTo,text})
    });
    let j={}; try{ j=await res.json(); }catch(e){}
    return res.ok ? {ok:true} : {error:(j&&j.error)||('HTTP '+res.status)};
  }catch(e){ return {error:String(e&&e.message||e)}; }
};
async function openQuotes(){
  quotesModal.innerHTML=`<div class="box"><h2>Your saved quotes</h2><div id="qlist">Loading…</div>
    <div class="mp-row"><button class="authbtn mp-ghost" id="q_close">Close</button></div></div>`;
  quotesModal.style.display='flex';
  quotesModal.querySelector('#q_close').onclick=()=>quotesModal.style.display='none';
  const {data,error}=await sb.from('quotes').select('*').order('created_at',{ascending:false}).limit(200);
  const list=quotesModal.querySelector('#qlist');
  if(error){ list.textContent=error.message; return; }
  if(!data||!data.length){ list.innerHTML='<p style="color:#6b7a8d">No saved quotes yet. Build a door and press “Save quote”.</p>'; return; }
  list.innerHTML=data.map(q=>{
    const s=q.spec||{}; const d=new Date(q.created_at).toLocaleDateString('en-GB');
    const price=q.customer_ex? money(q.customer_ex):(q.trade_ex?money(q.trade_ex):'POA');
    return `<div class="qrow" data-id="${q.id}"><div><b>${s.style||''}</b> · ${s.colour||''}<br>
      <span style="color:#6b7a8d;font-size:12px">${q.customer_name||'—'} · ${d} ${q.quote_ref?('· '+q.quote_ref):''}</span></div>
      <div class="r"><b>${price}</b><br><span style="color:#6b7a8d;font-size:12px">${q.customer_email||''}</span></div></div>`;
  }).join('');
  list.querySelectorAll('.qrow').forEach(r=>r.onclick=()=>{
    const q=data.find(x=>x.id===r.dataset.id); if(q && window.__loadQuote){ window.__loadQuote(q); quotesModal.style.display='none'; }
  });
}

/* ---------- ADMIN dashboard: all quotes across all dealers (Modplan only) ---------- */
/* The spreadsheet(s) the live pricing engine was built from — updated at every data build. */
const PRICING_SOURCE={file:'Composite Door Price Calculator - V1 May 2026.xlsm (+ Chris V3 changes)', applied:'6 Aug 2026', version:'V35'};
async function openAdmin(){
  quotesModal.innerHTML=`<div class="box" style="max-width:940px"><h2>Admin — all dealer quotes</h2>
    <p style="color:#6b7a8d;font-size:13px;margin:-6px 0 8px">Every quote from every dealer. Dealers cannot see this.</p>
    <input id="a_search" placeholder="Filter by dealer / customer / style…" style="width:100%;padding:9px 11px;border:1.5px solid #e3e8ef;border-radius:9px;margin-bottom:10px">
    <div id="alist" style="max-height:42vh;overflow:auto">Loading…</div>
    <div style="margin-top:16px;border-top:2px solid #e3e8ef;padding-top:12px">
      <h3 style="margin:0 0 4px;font-size:16px">Pricing data</h3>
      <p style="font-size:12.5px;margin:2px 0 8px">Currently powering the tool:
        <b>${PRICING_SOURCE.file}</b> <span style="color:#6b7a8d">(applied ${PRICING_SOURCE.applied} · ${PRICING_SOURCE.version})</span></p>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <input type="file" id="pf_file" accept=".csv,.xlsx,.xlsm" style="font-size:12.5px">
        <button class="authbtn" id="pf_up" style="padding:8px 16px">Upload price file</button>
        <span id="pf_msg" style="font-size:12px;color:#6b7a8d"></span>
      </div>
      <p style="font-size:11.5px;color:#8a929c;margin:8px 0 6px;line-height:1.5">Uploaded files are queued for the next data build.
        Price/spec changes to <b>existing</b> options are applied automatically at that build; files that <b>add new styles or options</b>
        are flagged and wired in (pricing + door rendering) before going live.</p>
      <div id="pf_list" style="max-height:18vh;overflow:auto;font-size:12.5px;color:#333">Loading uploads…</div>
    </div>
    <div class="mp-row"><button class="authbtn mp-ghost" id="a_close">Close</button></div></div>`;
  quotesModal.style.display='flex';
  quotesModal.querySelector('#a_close').onclick=()=>quotesModal.style.display='none';
  const [qres,pres]=await Promise.all([
    sb.from('quotes').select('*').order('created_at',{ascending:false}).limit(2000),
    sb.from('profiles').select('id,business_name,email')
  ]);
  const list=quotesModal.querySelector('#alist');
  if(qres.error){ list.textContent=qres.error.message; return; }
  const pmap={}; (pres.data||[]).forEach(p=>pmap[p.id]=p);
  const rows=(qres.data||[]).map(q=>{ const p=pmap[q.dealer_id]||{}; const s=q.spec||{};
    return {dealer:(p.business_name||p.email||'—'), cust:(q.customer_name||''), custEmail:(q.customer_email||''),
      door:((s.style||'')+' · '+(s.colour||'')), custP:q.customer_ex, tradeP:q.trade_ex,
      date:new Date(q.created_at).toLocaleDateString('en-GB'), blob:((p.business_name||'')+' '+(q.customer_name||'')+' '+(s.style||'')+' '+(s.colour||'')).toLowerCase()}; });
  function draw(f){
    const r=f?rows.filter(x=>x.blob.includes(f)):rows;
    if(!r.length){ list.innerHTML='<p style="color:#6b7a8d">No quotes'+(f?' match':' yet')+'.</p>'; return; }
    list.innerHTML='<table style="width:100%;border-collapse:collapse;font-size:12.5px"><tr style="background:#0e2a47;color:#fff;position:sticky;top:0">'+
      ['Dealer','Customer','Door','Customer £','Trade £','Date'].map(h=>`<th style="text-align:left;padding:7px">${h}</th>`).join('')+'</tr>'+
      r.map(x=>`<tr style="border-bottom:1px solid #eee"><td style="padding:7px"><b>${x.dealer}</b></td><td style="padding:7px">${x.cust}<br><span style="color:#8aa">${x.custEmail}</span></td><td style="padding:7px">${x.door}</td><td style="padding:7px;text-align:right">${x.custP?money(x.custP):'—'}</td><td style="padding:7px;text-align:right;color:#6b7a8d">${x.tradeP?money(x.tradeP):'—'}</td><td style="padding:7px;white-space:nowrap">${x.date}</td></tr>`).join('')+'</table>';
  }
  draw('');
  quotesModal.querySelector('#a_search').oninput=e=>draw(e.target.value.toLowerCase().trim());

  /* ---- Pricing data uploads (stored under <uid>/pricing/ in the logos bucket) ---- */
  const pfMsg=quotesModal.querySelector('#pf_msg'), pfList=quotesModal.querySelector('#pf_list');
  async function drawUploads(){
    try{
      const profs=pres.data||[];
      const all=[];
      await Promise.all(profs.map(async p=>{
        const {data:files}=await sb.storage.from('logos').list(p.id+'/pricing',{limit:100,sortBy:{column:'created_at',order:'desc'}});
        (files||[]).forEach(f=>{ if(f.name && !f.name.startsWith('.')) all.push({name:f.name.replace(/^\d+_/,''), raw:f.name, at:f.created_at, by:(p.business_name||p.email||'admin')}); });
      }));
      all.sort((a,b)=>new Date(b.at)-new Date(a.at));
      if(!all.length){ pfList.innerHTML='<span style="color:#8a929c">No files uploaded yet.</span>'; return; }
      pfList.innerHTML='<table style="width:100%;border-collapse:collapse"><tr style="color:#6b7a8d;text-align:left"><th style="padding:4px 6px">File</th><th style="padding:4px 6px">Uploaded</th><th style="padding:4px 6px">By</th><th style="padding:4px 6px">Status</th></tr>'+
        all.map(f=>`<tr style="border-top:1px solid #eef1f5"><td style="padding:4px 6px"><b>${f.name}</b></td><td style="padding:4px 6px;white-space:nowrap">${new Date(f.at).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</td><td style="padding:4px 6px">${f.by}</td><td style="padding:4px 6px;color:#b8860b;font-weight:600">Awaiting build</td></tr>`).join('')+'</table>';
    }catch(e){ pfList.textContent='Could not list uploads: '+(e.message||e); }
  }
  drawUploads();
  quotesModal.querySelector('#pf_up').onclick=async()=>{
    const inp=quotesModal.querySelector('#pf_file'); const file=inp.files&&inp.files[0];
    if(!file){ pfMsg.textContent='Choose a file first.'; return; }
    pfMsg.textContent='Uploading…';
    try{
      const path=`${window.__dealer.id}/pricing/${Date.now()}_${file.name.replace(/[^\w.\- ]/g,'_')}`;
      const {error}=await sb.storage.from('logos').upload(path,file,{contentType:file.type||'text/csv'});
      if(error) throw error;
      pfMsg.textContent='Uploaded ✔ — queued for the next data build.';
      inp.value=''; drawUploads();
    }catch(e){ pfMsg.textContent='Upload failed: '+(e.message||e); }
  };
}

function updateAcctBar(){
  const tag=document.getElementById('installerTag'); if(!tag) return;
  const d=window.__dealer||{};
  tag.innerHTML='';
  const bar=document.createElement('div'); bar.id='acctBar';
  const biz=document.createElement('div'); biz.className='biz';
  biz.innerHTML=(d.business_name?('<b>'+d.business_name+'</b><br>'):'')+ (d.email||'');
  bar.appendChild(biz);
  if(d.is_admin){ const ba=document.createElement('button'); ba.className='acctbtn'; ba.style.background='linear-gradient(180deg,#e0a24e,#c9832f)'; ba.style.color='#1a1a1a'; ba.style.border='none'; ba.textContent='Admin'; ba.onclick=openAdmin; bar.appendChild(ba); }
  const bq=document.createElement('button'); bq.className='acctbtn'; bq.textContent='My quotes'; bq.onclick=openQuotes;
  const bp=document.createElement('button'); bp.className='acctbtn'; bp.textContent='Profile'; bp.onclick=openProfile;
  const bo=document.createElement('button'); bo.className='acctbtn'; bo.textContent='Log out'; bo.onclick=()=>sb.auth.signOut().then(()=>location.reload());
  bar.appendChild(bq); bar.appendChild(bp); bar.appendChild(bo);
  tag.appendChild(bar);
}

/* ---------- session / boot ---------- */
let recovery=false;
sb.auth.onAuthStateChange(async (event,session)=>{
  if(event==='PASSWORD_RECOVERY' || needsPw){ recovery=true; mode='reset'; showLogin(); renderAuth(); return; }
  if(session && !recovery){ await loadProfile(); hideLogin(); updateAcctBar(); }
  if(!session){ mode='login'; showLogin(); renderAuth(); }
